name: Azure Static Web Apps CI/CD

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
  workflow_dispatch: {}
  # Fired by the Power Automate flow watching the "Projects" SharePoint list,
  # so a new/edited project publishes almost immediately. See README.
  repository_dispatch:
    types: [content-updated]
  # Safety net in case the Power Automate webhook silently fails.
  schedule:
    - cron: '17 3 * * *'

jobs:
  build_and_deploy_job:
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'repository_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Deploy to Azure Static Web Apps
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        env:
          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
          GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
          GRAPH_SITE_ID: ${{ secrets.GRAPH_SITE_ID }}
          GRAPH_PROJECTS_LIST_ID: ${{ secrets.GRAPH_PROJECTS_LIST_ID }}
          GRAPH_MEDIA_DRIVE_ID: ${{ secrets.GRAPH_MEDIA_DRIVE_ID }}
          GRAPH_PARTNERS_LIST_ID: ${{ secrets.GRAPH_PARTNERS_LIST_ID }}
          GRAPH_PARTNER_LOGOS_DRIVE_ID: ${{ secrets.GRAPH_PARTNER_LOGOS_DRIVE_ID }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.PUBLIC_TURNSTILE_SITE_KEY }}
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: '/'
          api_location: 'api'
          output_location: 'dist'

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: 'close'
